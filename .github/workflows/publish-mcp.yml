name: Publish MCP package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match all MCP package metadata)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Verify requested and package versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageInfo = JSON.parse(readFileSync('mcp/package.json', 'utf8'));
          const registryInfo = JSON.parse(readFileSync('mcp/server.json', 'utf8'));
          const lockInfo = JSON.parse(readFileSync('mcp/package-lock.json', 'utf8'));
          const requestedVersion = process.env.REQUESTED_VERSION;

          const versions = {
            requested: requestedVersion,
            package: packageInfo.version,
            lockfile: lockInfo.version,
            registry: registryInfo.version,
            registryPackage: registryInfo.packages?.[0]?.version,
          };

          if (Object.values(versions).some((version) => version !== requestedVersion)) {
            console.error('Requested and MCP package versions must all match:', versions);
            process.exit(1);
          }
          NODE

      - name: Install MCP package dependencies
        run: npm ci --prefix mcp

      - name: Run MCP tests
        run: npm --prefix mcp test

      - name: Typecheck MCP package
        run: npm --prefix mcp run typecheck

      - name: Build MCP package
        run: npm --prefix mcp run build

      - name: Verify npm package contents
        working-directory: mcp
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: mcp
        run: npm publish --access public
